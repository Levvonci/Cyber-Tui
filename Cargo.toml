[package]
name = "cyber-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tui-input = "0.10"

[profile.release]
opt-level = 3
lto = true
